<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Cebu Eastern College</title>
    <link rel="stylesheet" href="../../css/recovery.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-bg" aria-hidden="true"></div>

        <a href="../../../index/index.html" class="auth-back" aria-label="Back to school portal">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </a>

        <header class="auth-header">
            <img src="../../../images/cec-logo.png" alt="Cebu Eastern College logo">
            <h1>CEBU EASTERN COLLEGE</h1>
        </header>

        <section class="auth-card auth-card-padded" aria-labelledby="recovery-title">
            <div class="recovery-icon" aria-hidden="true">
                <i class="fa-solid fa-envelope envelope"></i>
                <i class="fa-solid fa-key key"></i>
            </div>

            <h2 class="recovery-title" id="recovery-title">Reset Password</h2>
            <p class="recovery-msg">Enter your registered email address to receive a password reset link</p>

            <form action="sign-in.html" method="get">
                <div class="field">
                    <label for="email">Email Address</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                        <input type="email" id="email" name="email" placeholder="e.g. admin@cebeastern.edu" autocomplete="email" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Send Reset Link</button>
            </form>

            <div class="recovery-divider">
                <a href="sign-in.html">Back to Sign In</a>
            </div>
        </section>
    </main>
<script src="../../js/api.js"></script>
<script>
(function () {
    'use strict';
    var form = document.querySelector('.auth-card form');
    if (!form) return;
    form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (!form.checkValidity()) { form.reportValidity(); return; }
        var btn = form.querySelector('.btn-primary');
        var original = btn.innerHTML;
        var body = {
            email: document.getElementById('email').value.trim()
        };
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
        API.post('/auth/admin/recover', body).then(function () {
            btn.disabled = false;
            btn.innerHTML = original;
            if (window.showToast) showToast('Password reset link sent to your email.');
        }).catch(function () {
            btn.disabled = false;
            btn.innerHTML = original;
            if (window.showToast) showToast('Failed to send reset link.', 'error');
        });
    });
})();
</script>
</body>
</html>
