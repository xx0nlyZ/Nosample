<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Registrar Account | Cebu Eastern College</title>
    <link rel="stylesheet" href="../../css/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-bg" aria-hidden="true"></div>

        <header class="auth-header">
            <img src="../../../images/cec-logo.png" alt="Cebu Eastern College logo">
            <h1>CEBU EASTERN COLLEGE</h1>
        </header>

        <section class="auth-card auth-card-padded" aria-labelledby="register-title">
            <h2 class="reg-title" id="register-title">Create Registrar Account</h2>
            <p class="reg-sub">Register to access registrar system.</p>

            <form action="login.html" method="get">
                <div class="field">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required>
                </div>

                <div class="field">
                    <label for="username">Username</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-user" aria-hidden="true"></i>
                        <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
                    </div>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                        <input type="email" id="email" name="email" placeholder="Enter email address" autocomplete="email" required>
                    </div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="new-password" required>
                    </div>
                </div>

                <div class="field">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password" autocomplete="new-password" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Register</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
</section>
</main>
<script src="../../js/api.js"></script>
<script>
(function () {
    'use strict';
    var form = document.querySelector('.auth-card form');
    if (!form) return;
    form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (!form.checkValidity()) { form.reportValidity(); return; }
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirm-password').value;
        if (password !== confirmPassword) {
            if (window.showToast) showToast('Passwords do not match.', 'error');
            return;
        }
        var btn = form.querySelector('.btn-primary');
        var original = btn.innerHTML;
        var body = {
            fullName: document.getElementById('full-name').value.trim(),
            username: document.getElementById('username').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: password
        };
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Registering...';
        API.post('/auth/registrar/register', body).then(function () {
            if (window.showToast) showToast('Account created successfully. Please log in.');
            window.location.href = 'login.html';
        }).catch(function () {
            btn.disabled = false;
            btn.innerHTML = original;
            if (window.showToast) showToast('Failed to create account.', 'error');
        });
    });
})();
</script>
</body>
</html>
