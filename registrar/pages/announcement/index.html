<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | CEC Registrar Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../css/reg-dashboard.css">
    <link rel="stylesheet" href="../../css/reg-analytics.css">
    <link rel="stylesheet" href="../../css/reg-enrollment.css">
    <link rel="stylesheet" href="../../css/reg-announcements.css">
</head>
<body class="dashboard-page">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="../../../images/cec-logo.png" alt="Cebu Eastern College logo">
            <strong>CEC</strong>
            <span>STUDENT PORTAL SYSTEM</span>
        </div>

        <nav class="sidebar-nav" aria-label="Registrar navigation">
            <a href="../../pages/dashboard/registrar.html"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
            <a href="../student-record/student-records.html"><i class="fa-solid fa-users"></i><span>Student Records</span></a>
            <a href="../enrollment-management/enrollment-management.html"><i class="fa-regular fa-file-lines"></i><span>Enrollment Management</span></a>
            <a href="../enrollment-management/enrollment-application.html"><i class="fa-regular fa-square-plus"></i><span>Enrollment Application</span></a>
            <a href="../report/reports.html"><i class="fa-solid fa-chart-simple"></i><span>Reports</span></a>
            <a href="../document-request/index.html"><i class="fa-regular fa-folder-open"></i><span>Document Requests</span></a>
            <a href="index.html" class="active"><i class="fa-solid fa-bullhorn"></i><span>Announcements</span></a>
        </nav>

        <div class="sidebar-bottom">
            <a href="../settings/settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
            <a href="../../pages/auth/login.html"><i class="fa-solid fa-arrow-right-from-bracket"></i><span>Logout</span></a>
        </div>
    </aside>

    <main class="dashboard-main">
        <header class="app-header">
            <button class="menu-toggle" type="button" id="menu-toggle" aria-label="Toggle sidebar"><i class="fa-solid fa-bars"></i></button>
            <h1 class="app-title">Registrar Dashboard</h1>

            <label class="app-search">
                <span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Search anything</span>
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input type="search" placeholder="Search anything...">
            </label>

            <div class="app-user">
                <span class="app-user-avatar">—</span>
                <span class="app-user-text">
                    <strong></strong>
                    <small>Registrar</small>
                </span>
            </div>
        </header>

        <section class="announce-content">
            <div class="page-head">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="../../pages/dashboard/registrar.html">Dashboard</a>
                    <i class="fa-solid fa-chevron-right"></i>
                    <span>Announcements</span>
                </nav>
            </div>

            <section class="summary-card" aria-label="Announcements summary">
                <div class="announce-summary-head">
                    <h3><i class="fa-solid fa-bullhorn" aria-hidden="true"></i> Announcements</h3>
                    <a class="announce-view-all" href="all.html">
                        View All <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                    </a>
                </div>

                <ul class="announce-list" id="announce-list">
                </ul>
            </section>
        </section>
    </main>

    <script src="../../js/api.js"></script>
    <script src="../../js/sidebar.js"></script>
    <script>
        (function () {
            var toggle = document.getElementById('menu-toggle');
            toggle.addEventListener('click', function () {
                document.body.classList.toggle('sidebar-collapsed');
            });
        })();
    </script>
    <script>
        (function () {
            'use strict';

            function escText(value) {
                var div = document.createElement('div');
                div.textContent = String(value == null ? '' : value);
                return div.innerHTML;
            }

            function renderAnnouncements(items) {
                var list = document.getElementById('announce-list');
                if (!list) return;
                if (!items || items.length === 0) {
                    list.innerHTML = '<li class="announce-item" style="text-align:center;color:var(--muted);font-size:13px;">No announcements.</li>';
                    return;
                }
                list.innerHTML = items.map(function (a) {
                    return '<li class="announce-item">' +
                        '<div class="announce-head"><h4>' + escText(a.title) + '</h4><span class="announce-date">' + escText(a.date || a.datePosted || '') + '</span></div>' +
                        '<p class="announce-desc">' + escText(a.description || a.message || '') + '</p>' +
                        '</li>';
                }).join('');
            }

            function load() {
                if (!window.API) return;
                window.API.get('/registrar/announcements').then(function (res) {
                    var items = (res && Array.isArray(res)) ? res : ((res && res.data) || []);
                    renderAnnouncements(items.slice(0, 3));
                }).catch(function () {
                    renderAnnouncements([]);
                });
            }

            load();
        })();
    </script>
</body>
</html>
