            <option>Select semester</option>

      <!-- Empty State View -->
      <div class="empty-panel" id="schedulePanel">

        <p>Your schedule will appear here after enrollment information is available.</p>
      </div>

<script src="../../js/api.js"></script>
<script>
    (function () {
        function esc(v) {
            return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
            });
        }

        var select = document.getElementById('schedule-term');
        var panel = document.getElementById('schedulePanel');

        function render(res) {
            if (!panel) return;
            var items = (res && Array.isArray(res)) ? res : ((res && res.data) || []);
            if (!items.length) return;
            var html = '' +
                '<table class="blank-table">' +
                '<thead><tr><th>Day</th><th>Time</th><th>Subject Code</th><th>Subject Title</th><th>Room</th></tr></thead><tbody>';
            items.forEach(function (s) {
                if (!s) return;
                html += '<tr>' +
                    '<td>' + esc(s.day) + '</td>' +
                    '<td>' + esc(s.time) + '</td>' +
                    '<td>' + esc(s.code) + '</td>' +
                    '<td>' + esc(s.title) + '</td>' +
                    '<td>' + esc(s.room) + '</td>' +
                    '</tr>';
            });
            html += '</tbody></table>';
            panel.innerHTML = html;
        }

        function load() {
            var term = select ? select.value : '';
            API.get('/student/schedule', { term: term === 'Select semester' ? '' : term }).then(render).catch(function () {
                if (window.showToast) showToast('Failed to load class schedule', 'error');
            });
        }

        if (select) select.addEventListener('change', load);
        load();
    })();
</script>
