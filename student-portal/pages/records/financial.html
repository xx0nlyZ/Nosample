<script src="../../js/api.js"></script>
<script>
    (function () {
        function esc(v) {
            return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
            });
        }

        var panel = document.getElementById('financialPanel');

        function render(d) {
            if (!panel || !d) return;
            var hasValue = d.assessment != null || d.payments != null || d.balance != null || (d.items && d.items.length);
            if (!hasValue) return;
            var html = '';
            html += '<table class="blank-table" style="margin-bottom:16px">' +
                '<thead><tr><th>Item</th><th>Amount</th></tr></thead><tbody>';
            if (d.assessment != null) html += '<tr><th>Assessment</th><td>' + esc(d.assessment) + '</td></tr>';
            if (d.payments != null) html += '<tr><th>Payments</th><td>' + esc(d.payments) + '</td></tr>';
            if (d.balance != null) html += '<tr><th>Balance</th><td>' + esc(d.balance) + '</td></tr>';
            html += '</tbody></table>';

            if (d.items && d.items.length) {
                html += '<table class="blank-table">' +
                    '<thead><tr><th>Description</th><th>Date</th><th>Amount</th></tr></thead><tbody>';
                d.items.forEach(function (it) {
                    if (!it) return;
                    var amount = it.amount != null ? it.amount : (it.total != null ? it.total : it.cost);
                    html += '<tr>' +
                        '<td>' + esc(it.description || it.particulars || it.item || it.name || '') + '</td>' +
                        '<td>' + esc(it.date || it.dueDate || it.transactionDate || it.createdOn || '') + '</td>' +
                        '<td>' + esc(amount) + '</td>' +
                        '</tr>';
                });
                html += '</tbody></table>';
            }

            panel.innerHTML = html;
        }

        API.get('/student/financial').then(function (res) {
            var d = (res && res.data) ? res.data : (res || {});
            render(d);
        }).catch(function () {
            if (window.showToast) showToast('Failed to load financial information', 'error');
        });
    })();
</script>
