<script src="../../js/api.js"></script>
<script>
    (function () {
        function esc(v) {
            return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
            });
        }

        var select = document.getElementById('grade-term');
        var tbody = document.getElementById('gradesBody');

        function render(res) {
            if (!tbody) return;
            var items = (res && Array.isArray(res)) ? res : ((res && res.data) || []);
            var html = '';
            items.forEach(function (g) {
                if (!g) return;
                html += '<tr>' +
                    '<td>' + esc(g.code) + '</td>' +
                    '<td>' + esc(g.title) + '</td>' +
                    '<td>' + esc(g.units) + '</td>' +
                    '<td>' + esc(g.midterm) + '</td>' +
                    '<td>' + esc(g.final) + '</td>' +
                    '<td>' + esc(g.grade) + '</td>' +
                    '<td>' + esc(g.remarks) + '</td>' +
                    '</tr>';
            });
            tbody.innerHTML = html;
        }

        function load() {
            var term = select ? select.value : '';
            API.get('/student/grades', { term: term === 'Select semester' ? '' : term }).then(render).catch(function () {
                render(null);
                if (window.showToast) showToast('Failed to load grades', 'error');
            });
        }

        if (select) select.addEventListener('change', load);
        load();
    })();
</script>
