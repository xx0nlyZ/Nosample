<script src="../../js/api.js"></script>
<script>
    (function () {
        function esc(v) {
            return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
            });
        }

        var panel = document.getElementById('announcementsPanel');

        function render(items) {
            if (!panel || !items || !items.length) return;
            var html = '' +
                '<table class="blank-table">' +
                '<thead><tr><th>Subject</th><th>Excerpt</th><th>Date</th></tr></thead><tbody>';
            items.forEach(function (a) {
                if (!a) return;
                html += '<tr>' +
                    '<td>' + esc(a.subject) + '</td>' +
                    '<td>' + esc(a.excerpt || a.summary) + '</td>' +
                    '<td>' + esc(a.date) + '</td>' +
                    '</tr>';
            });
            html += '</tbody></table>';
            panel.innerHTML = html;
        }

        API.get('/student/announcements').then(function (res) {
            var items = (res && Array.isArray(res)) ? res : ((res && res.data) || []);
            render(items);
        }).catch(function () {
            if (window.showToast) showToast('Failed to load announcements', 'error');
        });
    })();
</script>
