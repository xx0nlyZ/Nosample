<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery | Cebu Eastern College</title>
    <link rel="stylesheet" href="../../css/password-recovery.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-bg" aria-hidden="true"></div>

        <header class="auth-header">
            <img src="../../../images/cec-logo.png" alt="Cebu Eastern College logo">
            <h1>CEBU EASTERN COLLEGE</h1>
        </header>

        <section class="auth-card auth-card-padded" aria-labelledby="recovery-title">
            <div class="recovery-icon" aria-hidden="true">
                <i class="fa-solid fa-envelope envelope"></i>
                <i class="fa-solid fa-key key"></i>
            </div>

            <h2 class="recovery-title" id="recovery-title">Forgot Password?</h2>
            <p class="recovery-msg">To recover your password, please enter your Student ID. We will send recovery instructions to your registered email address.</p>

            <form action="student.html" method="get">
                <div class="field">
                    <label for="recovery-id">Student ID</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-id-card" aria-hidden="true"></i>
                        <input type="text" id="recovery-id" name="student-id" placeholder="Enter Student ID" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Send Recovery Code</button>
            </form>

            <div class="recovery-divider">
                <a href="student.html">Back to Log in</a>
            </div>
        </section>
    </main>
<script src="../../js/api.js"></script>
<script>
(function () {
    'use strict';
    var form = document.querySelector('.auth-card form');
    if (!form) return;
    form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (!form.checkValidity()) { form.reportValidity(); return; }
        var btn = form.querySelector('.btn-primary');
        var original = btn.innerHTML;
        var body = {
            studentId: document.getElementById('recovery-id').value.trim()
        };
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
        API.post('/auth/student/recover', body).then(function () {
            btn.disabled = false;
            btn.innerHTML = original;
            if (window.showToast) showToast('Recovery code sent to your registered email.');
        }).catch(function () {
            btn.disabled = false;
            btn.innerHTML = original;
            if (window.showToast) showToast('Failed to send recovery code.', 'error');
        });
    });
})();
</script>
<script src="../../js/showToast.js"></script>
<script src="../../js/copyToClipboard.js"></script>
<script src="../../js/confirmAction.js"></script>
<script src="../../js/avatarUpload.js"></script>
<script src="../../js/validateForm.js"></script>
<script src="../../js/persistSelect.js"></script>
<script src="../../js/setYear.js"></script>
</body>
</html>
