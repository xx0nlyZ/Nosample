<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Cebu Eastern College</title>
    <link rel="stylesheet" href="../../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-bg" aria-hidden="true"></div>

        <a href="../../../index/index.html" class="auth-back" aria-label="Back to school portal">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </a>

        <header class="auth-header">
            <img src="../../../images/cec-logo.png" alt="Cebu Eastern College logo">
            <h1>CEBU EASTERN COLLEGE</h1>
        </header>

        <section class="auth-card login-card" aria-labelledby="login-title">
            <div class="welcome-panel">
                <div>
                    <h2>Welcome Back!</h2>
                    <p>View your class schedules, grades, enrollment records, and academic standing all in one place. Access here is limited to enrolled students.</p>
                </div>
                <div class="welcome-foot">
                    <span>Student use only</span>
                </div>
            </div>

            <div class="form-panel">
                <h2 id="login-title">Sign In</h2>
                <form action="../dashboard/student-dashboard.html" method="get">
                    <div class="field">
                        <label for="student-id">Student ID</label>
                        <input type="text" id="student-id" name="student-id" placeholder="e.g. 2024-12345" autocomplete="username" required>
                    </div>

                    <div class="field">
                        <div class="field-top">
                            <label for="student-password">Password</label>
                            <a href="password-recovery.html">Forgot Password?</a>
                        </div>
                        <input type="password" id="student-password" name="password" placeholder="Enter password" autocomplete="current-password" required>
                    </div>

                    <label class="remember-row">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>

                    <button type="submit" class="btn-primary">Sign In</button>
                </form>

                <p class="auth-switch">Don't have an account? <a href="create-account.html">Register</a></p>
            </div>
        </section>
    </main>
<script src="../../js/api.js"></script>
<script>
    (function () {
        var form = document.querySelector('.login-card form');
        if (!form) return;
        form.addEventListener('submit', function (event) {
            event.preventDefault();
            var idInput = document.getElementById('student-id');
            var passInput = document.getElementById('student-password');
            var id = idInput ? idInput.value.trim() : '';
            var password = passInput ? passInput.value : '';
            if (!id || !password) {
                if (window.showToast) showToast('Please enter your student ID and password', 'error');
                return;
            }
            API.post('/auth/student/login', { studentId: id, password: password }).then(function () {
                window.location.href = form.getAttribute('action') || '../dashboard/student-dashboard.html';
            }).catch(function (err) {
                var msg = (err && err.message) ? err.message : 'Login failed. Please try again.';
                if (window.showToast) showToast(msg, 'error');
            });
        });
    })();
</script>
<script src="../../js/showToast.js"></script>
<script src="../../js/copyToClipboard.js"></script>
<script src="../../js/confirmAction.js"></script>
<script src="../../js/avatarUpload.js"></script>
<script src="../../js/validateForm.js"></script>
<script src="../../js/persistSelect.js"></script>
<script src="../../js/setYear.js"></script>
</body>
</html>
