<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Student Account | Cebu Eastern College</title>
    <link rel="stylesheet" href="../../css/create-account.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-bg" aria-hidden="true"></div>

        <header class="auth-header">
            <img src="../../../images/cec-logo.png" alt="Cebu Eastern College logo">
            <h1>CEBU EASTERN COLLEGE</h1>
        </header>

        <section class="auth-card auth-card-padded" aria-labelledby="register-title">
            <h2 class="reg-title" id="register-title">Create Student Account</h2>
            <p class="reg-sub">Register to access the student portal.</p>

            <form action="student.html" method="get">
                <div class="field">
                    <label for="full-name">Full Name</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-user" aria-hidden="true"></i>
                        <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required>
                    </div>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                        <input type="email" id="email" name="email" placeholder="Enter email address" autocomplete="email" required>
                    </div>
                </div>

                <div class="field">
                    <label for="account-password">Password</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input type="password" id="account-password" name="password" placeholder="Enter password" autocomplete="new-password" required>
                    </div>
                </div>

                <div class="field">
                    <label for="student-number">Student ID Number</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-id-card" aria-hidden="true"></i>
                        <input type="text" id="student-number" name="student-number" placeholder="Enter Student ID number" required>
                    </div>
                </div>

                <div class="field">
                    <label for="course">Course/Program</label>
                    <select id="course" name="course" required>
                        <option value="" selected disabled>Select course/program</option>
                        <option value="BSIT">Bachelor of Science in Information Technology (BSIT)</option>
                        <option value="BSHM">Bachelor of Science in Hospitality Management (BSHM)</option>
                        <option value="BSTM">Bachelor of Science in Tourism Management (BSTM)</option>
                        <option value="BSED">Bachelor of Secondary Education (BSED)</option>
                        <option value="BEED">Bachelor of Elementary Education (BEED)</option>
                        <option value="BSCrim">Bachelor of Science in Criminology (BSCrim)</option>
                    </select>
                </div>

                <div class="field">
                    <label for="year-level">Year Level</label>
                    <select id="year-level" name="year-level" required>
                        <option value="" selected disabled>Select year level</option>
                        <option>First Year</option>
                        <option>Second Year</option>
                        <option>Third Year</option>
                        <option>Fourth Year</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">Register</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="student.html">Log in</a></p>
        </section>
    </main>
<script src="../../js/api.js"></script>
<script>
(function () {
    'use strict';
    var form = document.querySelector('.auth-card form');
    if (!form) return;
    form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (!form.checkValidity()) { form.reportValidity(); return; }
        var btn = form.querySelector('.btn-primary');
        var original = btn.innerHTML;
        var body = {
            fullName: document.getElementById('full-name').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('account-password').value,
            studentId: document.getElementById('student-number').value.trim(),
            course: document.getElementById('course').value,
            yearLevel: document.getElementById('year-level').value
        };
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Registering...';
        API.post('/auth/student/register', body).then(function () {
            if (window.showToast) showToast('Account created successfully. Please log in.');
            window.location.href = 'student.html';
        }).catch(function () {
            btn.disabled = false;
            btn.innerHTML = original;
            if (window.showToast) showToast('Failed to create account.', 'error');
        });
    });
})();
</script>
<script src="../../js/showToast.js"></script>
<script src="../../js/copyToClipboard.js"></script>
<script src="../../js/confirmAction.js"></script>
<script src="../../js/avatarUpload.js"></script>
<script src="../../js/validateForm.js"></script>
<script src="../../js/persistSelect.js"></script>
<script src="../../js/setYear.js"></script>
</body>
</html>
