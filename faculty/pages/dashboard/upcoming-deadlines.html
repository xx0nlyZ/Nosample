    <script src="../../js/api.js"></script>

    <script>
        (function () {
            var grid = document.getElementById('deadline-grid');
            var search = document.getElementById('deadline-search');
            var subjectFilter = document.getElementById('subject-filter');

            function toItems(res) { return (res && Array.isArray(res)) ? res : ((res && res.data) || []); }
            function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
            var MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEPT', 'OCT', 'NOV', 'DEC'];

            function dateParts(value) {
                var d = value ? new Date(value) : null;
                if (!d || isNaN(d.getTime())) return { month: '', day: '' };
                return { month: MONTHS[d.getMonth()], day: String(d.getDate()) };
            }

            function statusClass(status) {
                var s = String(status || '').toLowerCase();
                if (s.indexOf('due') !== -1 || s.indexOf('today') !== -1) return 'status-red';
                if (s.indexOf('in ') === 0) return 'status-amber';
                return 'status-blue';
            }

            function render(list) {
                if (!list.length) {
                    grid.innerHTML = '<article class="deadline-card"><div class="deadline-info"><h3>No upcoming deadlines</h3></div></article>';
                    return;
                }
                var html = '';
                list.forEach(function (d) {
                    var parts = dateParts(d.dueDate || d.date);
                    html += '<article class="deadline-card">';
                    html += '<div class="deadline-date"><small>' + esc(parts.month) + '</small><strong>' + esc(parts.day) + '</strong></div>';
                    html += '<div class="deadline-info"><h3>' + esc(d.title || '') + '</h3><span class="class-tag">' + esc(d.classTag || d.section || d.className || 'All Section') + '</span></div>';
                    html += '<span class="status-badge ' + statusClass(d.status) + '">' + esc(d.status || 'Upcoming') + '</span>';
                    html += '</article>';
                });
                grid.innerHTML = html;
                applyFilters();
            }

            function applyFilters() {
                var query = search.value.toLowerCase().trim();
                var subject = subjectFilter.value;
                var cards = grid.querySelectorAll('.deadline-card');

                cards.forEach(function (card) {
                    var text = card.textContent.toLowerCase();
                    var tag = card.querySelector('.class-tag');
                    var matchesQuery = query === '' || text.indexOf(query) !== -1;
                    var matchesSubject = subject === '' || (tag && tag.textContent === subject);
                    card.style.display = matchesQuery && matchesSubject ? '' : 'none';
                });
            }

            search.addEventListener('input', applyFilters);
            subjectFilter.addEventListener('change', applyFilters);

            API.get('/faculty/dashboard/deadlines').then(function (res) {
                render(toItems(res));
            }).catch(function () {
                if (window.showToast) showToast('Failed to load deadlines', 'error');
                render([]);
            });
        })();
    </script>
