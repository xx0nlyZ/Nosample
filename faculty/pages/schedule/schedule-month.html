    <main class="dashboard-main">
        <header class="dashboard-header">

            </label>

            </button>

            <button class="profile-button" type="button">
                <span class="profile-avatar">CB</span>

                    <strong>Mr. Charles Bacus</strong>
                    <small>Faculty</small>
                </span>
            </button>
        </header>

        <section class="dashboard-content">
            <div class="schedule-head">
                <div>
                    <div class="page-head">
                        <h1>My Schedule</h1>
                        <p class="page-desc">Track your class schedule for the active term.</p>
                    </div>
                </div>
                <div class="schedule-nav">
                    <button class="date-nav-btn" type="button" aria-label="Previous"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
                    <span class="date-nav-label" id="dateLabel">&mdash;</span>
                    <button class="date-nav-btn" type="button" aria-label="Next"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>

                    <nav class="view-toggle" aria-label="Calendar view">
                        <a href="schedule-day.html">Day</a>

                        <a href="schedule-month.html" class="active">Month</a>
                    </nav>
                </div>
            </div>

            <div class="calendar-card">
                <div class="calendar-grid" id="calendarGrid">
                    <span class="calendar-day-head">Sun</span>
                    <span class="calendar-day-head">Mon</span>
                    <span class="calendar-day-head">Tue</span>
                    <span class="calendar-day-head">Wed</span>
                    <span class="calendar-day-head">Thu</span>
                    <span class="calendar-day-head">Fri</span>
                    <span class="calendar-day-head">Sat</span>

                </div>
            </div>
        </section>
    </main>
<script src="../../js/api.js"></script>
<script src="../../js/facultyIdentity.js"></script>
<script>
    (function () {
        function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
        function param(name) { var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }
        function setText(id, value) { var el = document.getElementById(id); if (el) el.textContent = (value == null || value === '') ? '\u2014' : value; }

        function render(d) {
            d = (d && d.data) ? d.data : (d || {});
            setText('dateLabel', d.label);

            var grid = document.getElementById('calendarGrid');
            grid.querySelectorAll('.calendar-cell').forEach(function (el) { el.remove(); });

            var html = '';
            (d.cells || []).forEach(function (c) {
                var cls = 'calendar-cell' + (c.otherMonth ? ' other-month' : '') + (c.today ? ' today' : '');
                html += '<div class="' + cls + '"><span class="day-num">' + esc(c.day) + '</span>';
                if (c.today) html += '<span class="today-tag">Today</span>';
                (c.events || []).forEach(function (ev) {
                    html += '<span class="event-pill ' + esc(ev.theme || 'theme-blue') + '">' + esc(ev.label) + '</span>';
                });
                html += '</div>';
            });
            grid.insertAdjacentHTML('beforeend', html);
        }

        var baseDate = param('date') ? new Date(param('date') + 'T00:00:00') : new Date();
        if (isNaN(baseDate.getTime())) baseDate = new Date();
        document.querySelectorAll('.date-nav-btn').forEach(function (btn, idx) {
            btn.addEventListener('click', function () {
                var d = new Date(baseDate.getTime());
                d.setMonth(d.getMonth() + (idx === 0 ? -1 : 1));
                window.location.href = 'schedule-month.html?date=' + d.toISOString().slice(0, 10);
            });
        });

        API.get('/faculty/schedule/month', { date: param('date') }).then(function (res) {
            render(res);
        }).catch(function () {
            render({});
            if (window.showToast) showToast('Failed to load schedule', 'error');
        });
    })();
</script>
<script src="../../js/showToast.js"></script>
<script src="../../js/copyToClipboard.js"></script>

<script src="../../js/avatarUpload.js"></script>
