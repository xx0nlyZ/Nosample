<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login | Cebu Eastern College</title>
    <link rel="stylesheet" href="../../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-bg" aria-hidden="true"></div>

        <a href="../../../index/index.html" class="auth-back" aria-label="Back to school portal">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </a>

        <header class="auth-header">
            <img src="../../../images/cec-logo.png" alt="Cebu Eastern College logo">
            <h1>CEBU EASTERN COLLEGE</h1>
        </header>

        <section class="auth-card login-card" aria-labelledby="login-title">
            <div class="welcome-panel">
                <div>
                    <h2>Welcome Back!</h2>
                    <p>Log in to your faculty account. Access your teaching materials, gradebook, and course schedules. For authorized faculty use only.</p>
                </div>
                <div class="welcome-foot">
                    <span>Faculty use only</span>
                </div>
            </div>

            <div class="form-panel">
                <h2 id="login-title">Sign In</h2>
                <form action="../dashboard/faculty-dashboard.html" method="get">
                    <div class="field">
                        <label for="faculty-id">Faculty ID</label>
                        <input type="text" id="faculty-id" name="faculty-id" placeholder="e.g. FAC - 12345" autocomplete="username" required>
                    </div>

                    <div class="field">
                        <div class="field-top">
                            <label for="faculty-password">Password</label>
                            <a href="password-recovery.html">Forgot Password?</a>
                        </div>
                        <input type="password" id="faculty-password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>

<label class="remember-row">
                        <input type="checkbox" id="keep-signed-in" name="keep-signed-in">
                        <span>Keep me signed in</span>
                    </label>

                    <button type="submit" class="btn-primary">Sign In</button>
                </form>

                <p class="auth-switch">Don&#39;t have an account? <a href="register.html">Register</a></p>
            </div>
        </section>
    </main>
<script src="../../js/api.js"></script>
<script>
(function () {
    'use strict';
    var form = document.querySelector('.auth-card form');
    if (!form) return;
    form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (!form.checkValidity()) { form.reportValidity(); return; }
        var btn = form.querySelector('.btn-primary');
        var original = btn.innerHTML;
        var body = {
            id: document.getElementById('faculty-id').value.trim(),
            password: document.getElementById('faculty-password').value,
            keepSignedIn: document.getElementById('keep-signed-in') ? document.getElementById('keep-signed-in').checked : false
        };
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Signing in...';
        API.post('/auth/faculty/login', body).then(function () {
            window.location.href = '../dashboard/faculty-dashboard.html';
        }).catch(function () {
            btn.disabled = false;
            btn.innerHTML = original;
            if (window.showToast) showToast('Invalid faculty ID or password.', 'error');
        });
    });
})();
</script>
<script src="../../js/showToast.js"></script>
<script src="../../js/copyToClipboard.js"></script>
<script src="../../js/confirmAction.js"></script>
<script src="../../js/avatarUpload.js"></script>
<script src="../../js/validateForm.js"></script>
<script src="../../js/persistSelect.js"></script>
<script src="../../js/setYear.js"></script>

</body>
</html>
